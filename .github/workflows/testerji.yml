name: TestFlight testerji

# Izpiše testerje ali odstrani vse razen Urške in Teota (aplikacija je zdaj v App Store).
on:
  push:
    branches: [testerji]
  workflow_dispatch:
    inputs:
      mode:
        description: "list = samo izpiši, remove = odstrani"
        default: list

jobs:
  testerji:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'si.nakupko.app' }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      MODE: ${{ inputs.mode || 'list' }}
      KEEP: "teo.simonic7@gmail.com,urska.repusic@gmail.com,teo,urška,urska"
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/testflight-testers.py
