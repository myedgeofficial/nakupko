name: iOS aplikacija

# PR: preveri, da se iOS aplikacija zgradi (brez podpisa).
# main ali ročni zagon: zgradi, podpiše in naloži na TestFlight.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'si.nakupko.app' }}
      HAS_SECRETS: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Pripravi spletni del in Capacitor
        run: |
          npm ci
          npm run sync

      - name: Preizkusna gradnja (brez podpisa)
        if: github.event_name == 'pull_request' || env.HAS_SECRETS != 'true'
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            NAKUPKO_BUNDLE_ID="$BUNDLE_ID" CODE_SIGNING_ALLOWED=NO build | tail -n 80
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Za TestFlight dodaj skrivnosti APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 in APPLE_TEAM_ID (glej native/README.md)."
          fi

      - name: Zgradi, podpiši in naloži na TestFlight
        if: github.event_name != 'pull_request' && env.HAS_SECRETS == 'true'
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          sed "s/TEAM_ID/$TEAM_ID/" ../../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nakupko.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            NAKUPKO_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -n 80

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nakupko.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 80

          rm -f "$KEY_PATH"
          echo "::notice::Gradnja $BUILD_NUMBER je naložena. Na TestFlightu bo vidna, ko jo Apple obdela (običajno 5–15 minut)."
