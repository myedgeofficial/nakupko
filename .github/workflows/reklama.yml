name: Reklama (posnetek simulatorja)

# Posname reklamo v Applovem iOS simulatorju: pravi iOS (zaklenjen zaslon, obvestila,
# Live Activity), posnet v polni ločljivosti. Aplikacije ne spreminja.
on:
  push:
    branches: [reklama]
    paths: [".github/workflows/reklama.yml", "reklama/**"]
  workflow_dispatch:

concurrency:
  group: reklama
  cancel-in-progress: true

jobs:
  posnetek:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Orodja (AXe za dotike v simulatorju)
        run: |
          brew tap cameroncooke/axe >/dev/null
          brew install cameroncooke/axe/axe ffmpeg >/dev/null
          brew tap wix/brew && brew install applesimutils || echo "::warning::applesimutils ni namescen"
          axe --version || true

      - name: Zgradi aplikacijo za simulator
        working-directory: native
        run: |
          npm ci
          npm run sync
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 15; tail -n 60 "$RUNNER_TEMP/build.log"; exit 65; }
          APP=$(find "$RUNNER_TEMP/dd" -path "*Release-iphonesimulator/App.app" -type d | head -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls "$APP/PlugIns" || true

      - name: Posnemi
        env:
          PYTHONUNBUFFERED: "1"
          JEZIK: en
        run: python3 reklama/drive.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reklama
          path: out/
          retention-days: 7
