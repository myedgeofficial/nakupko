name: TestFlight ponovna povabila

# Push na vejo claude/project-thread-f3qn8g preveri testerja EMAIL in mu ponovno pošlje vsa povabila.
on:
  push:
    branches: [claude/project-thread-f3qn8g]
    paths: [".github/workflows/povabila.yml", ".github/scripts/povabila.py"]

jobs:
  povabila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: python3 .github/scripts/povabila.py
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          BUNDLES: "si.nakupko.app,com.byurska.lumora,si.fixko.app,com.byurska.studio"
          ODSTRANI: ""
