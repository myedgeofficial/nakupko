name: probe-cene
on: { push: { branches: [probe-cene] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -q openpyxl
      - run: python3 scripts/update-prices-abroad.py
      - name: Pregled
        if: always()
        run: |
          ls -la prices-*.json || true
          for c in AT HR HU; do [ -f prices-$c.json ] && python3 - "$c" <<'PY'
          import json,sys
          c=sys.argv[1];d=json.load(open(f'prices-{c}.json'))
          print(c,d['valuta'],len(d['izdelki']),list(d['verige']))
          want=['Mleko','Kruh beli','Jajca','Banane','Maslo','Jogurt navadni','Sladkor','Moka bela','Kava mleta','Pivo','Coca-Cola','Toaletni papir','Olje sončnično','Riž','Testenine špageti','Piščančji file','Sir Gauda','Paradižnik','Krompir','Voda','Čokolada','Čips','Zobna pasta','Šampon']
          by={x['ime']:x['cene'] for x in d['izdelki']}
          for w in want: print(' ',w,by.get(w))
          PY
          done
