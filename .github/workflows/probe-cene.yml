name: probe-cene
on: { push: { branches: [probe-cene] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HR cijene.dev
        run: |
          curl -sSL https://cijene.dev/archive -o a.html; grep -oE 'href="[^"]+\.zip"' a.html | head -5
          Z=$(grep -oE 'https?://[^"]+\.zip' a.html | head -1); [ -z "$Z" ] && Z="https://cijene.dev$(grep -oE 'href="/[^"]+\.zip"' a.html | head -1 | cut -d'"' -f2)"
          echo "ZIP=$Z"; curl -sSL "$Z" -o hr.zip; ls -la hr.zip; unzip -l hr.zip | head -30
          unzip -q -o hr.zip -d hr; for f in $(find hr -name '*.csv' | head -6); do echo "== $f $(wc -l <"$f")"; head -3 "$f"; done
          F=$(find hr -path '*konzum*' -name 'prices.csv' | head -1); echo "konzum prices: $F"; grep -i "mlijeko" $(dirname $F)/products.csv 2>/dev/null | head -5
      - name: AT heisse-preise
        run: |
          curl -sSL -o at.json https://heisse-preise.io/data/latest-canonical.json; ls -la at.json
          python3 -c "
          import json;d=json.load(open('at.json'));print(type(d),len(d))
          from collections import Counter;print(Counter(x.get('store') for x in d))
          print(json.dumps(d[0])[:600])
          import itertools
          print(max(x['priceHistory'][0]['date'] for x in d if x.get('priceHistory')))
          print([ (x['store'],x['name'],x['price'],x.get('unit'),x.get('quantity')) for x in d if 'milch' in x['name'].lower()][:8])"
      - name: HU arfigyelo
        run: |
          curl -sSL https://arfigyelo.gvh.hu/ -o hu.html; grep -oE 'src="[^"]+\.js"' hu.html | head
          for j in $(grep -oE 'src="[^"]+\.js"' hu.html | cut -d'"' -f2 | head -5); do u=$j; case $u in http*) ;; *) u="https://arfigyelo.gvh.hu$u";; esac; curl -sSL "$u" | grep -oE '"/?api/[^"]{0,80}"|https://[a-z.]*gvh[^"]{0,80}' | sort -u | head -30; done
          curl -sS -o /dev/null -w "%{http_code}\n" "https://arfigyelo.gvh.hu/api/search?q=tej"
