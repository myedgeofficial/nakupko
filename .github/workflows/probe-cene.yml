name: probe-cene
on: { push: { branches: [probe-cene] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HR cijene.dev
        continue-on-error: true
        run: |
          set +e
          curl -sS https://api.cijene.dev/v0/list | head -c 1500; echo
          U=$(curl -sS https://api.cijene.dev/v0/list | python3 -c "import json,sys;d=json.load(sys.stdin);a=d.get('archives',d) if isinstance(d,dict) else d;print(sorted(a,key=lambda x:x.get('date',''))[-1].get('url',''))")
          echo "URL=$U"; curl -sSL "$U" -o hr.zip -w "%{http_code} %{size_download}\n"; unzip -l hr.zip | head -40
          unzip -q -o hr.zip -d hr; for f in $(find hr -name '*.csv' | grep -i konzum | head -4); do echo "== $f $(wc -l <"$f")"; head -3 "$f"; done
          find hr -maxdepth 2 | head -40
      - name: HU arfigyelo
        continue-on-error: true
        run: |
          set +e
          curl -sSL https://arfigyelo.gvh.hu/assets/index-5baaf084.js -o hu.js
          grep -oE '.{300}Napi termékadatok letöltése.{300}' hu.js | head -3
          grep -oE '.{120}"/api".{200}' hu.js | head -3
          grep -oE '`[^`]{0,30}/(api|download|export)[^`]{0,80}`|"[^"]{0,30}/(api|download|export)/[^"]{0,80}"' hu.js | sort -u | head -40
