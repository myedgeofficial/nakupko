name: probe-cene
on: { push: { branches: [probe-cene] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HU xlsx
        continue-on-error: true
        run: |
          set +e
          pip install -q openpyxl
          curl -sSL -o hu.xlsx -w "%{http_code} %{size_download}\n" https://cdnarfigyeloprodweu.azureedge.net/excel/arfigyelo_napi_termekadatok.xlsx
          python3 - <<'PY'
          import openpyxl
          wb=openpyxl.load_workbook('hu.xlsx',read_only=True)
          for ws in wb.worksheets:
              print("SHEET",ws.title,ws.max_row,ws.max_column)
              for i,r in enumerate(ws.iter_rows(values_only=True)):
                  if i<8: print(r)
                  else: break
          ws=wb.worksheets[0]
          n=0
          for r in ws.iter_rows(values_only=True):
              s=" ".join(str(x) for x in r if x is not None).lower()
              if "tej" in s and n<10: print("TEJ",r); n+=1
          PY
