name: Android video (Google Play lokacija)

# Posname zaslon navideznega Android telefona: razlaga za lokacijo »Vedno«,
# sistemsko vprašanje in seznam, ki se pokaže ob prihodu v trgovino.
# Video in slike zaslona objavi na https://github.com/myedgeofficial/nakupko/releases/tag/android-video
on:
  push:
    branches: [android-video]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-video
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prenesi APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android -p Nakupko.apk -D "$RUNNER_TEMP"

      - name: Posnemi
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ runner.temp }}/Nakupko.apk
          OUT: ${{ runner.temp }}/video
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash native/scripts/android-video.sh

      - name: Objavi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la "$RUNNER_TEMP/video" || true
          gh release delete android-video --cleanup-tag --yes || true
          find "$RUNNER_TEMP/video" -type f -size 0 -delete || true
          gh release create android-video "$RUNNER_TEMP"/video/* --target "$GITHUB_SHA" --prerelease \
            --title "Nakupko Android video (gradnja ${{ github.run_number }})" --notes "Video za Google Play prijavo lokacije v ozadju."
