name: TestFlight zunanji testerji

# Push na vejo testerji-dodaj (ali claude/project-thread-f3qn8g) doda e-pošte iz EMAILS kot zunanje testerje Nakupka in Lumore (ista Applova ekipa).
on:
  push:
    branches: [testerji-dodaj, claude/project-thread-f3qn8g]
    paths: [".github/workflows/testerji-dodaj.yml", ".github/scripts/zunanji-testerji.py"]

jobs:
  dodaj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: python3 .github/scripts/zunanji-testerji.py
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          BUNDLES: "si.nakupko.app,com.byurska.lumora,si.fixko.app"
          EMAILS: "nika.rihtaric@gmail.com"
