name: Android aplikacija

# PR: preveri, da se Android aplikacija zgradi.
# main, veja android ali ročni zagon: zgradi APK (za prijatelje, brez reklam in naročnine)
# in AAB (za Google Play, z reklamami AdMob in naročnino Nakupko Plus)
# ter ju objavi na https://github.com/myedgeofficial/nakupko/releases/tag/android
on:
  pull_request:
  push:
    branches: [main, android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Pripravi spletni del in Capacitor
        run: |
          npm ci
          npm run sync:android

      # Obvestila skupnega seznama (FCM): google-services.json ustvarimo iz Firebase projekta nakupko-8ad19,
      # da ne gre v (javen) git. Če Android aplikacija v Firebase še ne obstaja, jo ustvarimo.
      - name: Firebase za obvestila (google-services.json)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Ni FIREBASE_SERVICE_ACCOUNT: gradnja brez obvestil skupnega seznama."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          FB="npx --yes firebase-tools@14 --project nakupko-8ad19 --non-interactive"
          id=$($FB apps:list ANDROID --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s).result||[]).find(a=>a.packageName==="si.nakupko.app");process.stdout.write(r?r.appId:"")})')
          if [ -z "$id" ]; then
            $FB apps:create ANDROID "Nakupko Android" --package-name si.nakupko.app
            id=$($FB apps:list ANDROID --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s).result||[]).find(a=>a.packageName==="si.nakupko.app");process.stdout.write(r?r.appId:"")})')
          fi
          [ -n "$id" ] || { echo "::error::Android aplikacije v Firebase ni bilo mogoče ustvariti"; exit 1; }
          $FB apps:sdkconfig ANDROID "$id" --out android/app/google-services.json
          rm -f "$RUNNER_TEMP/sa.json"
          node -e 'const j=require("./android/app/google-services.json");if(!(j.client||[]).some(c=>c.client_info.android_client_info.package_name==="si.nakupko.app"))process.exit(1)' || { echo "::error::google-services.json nima si.nakupko.app"; exit 1; }
          echo "google-services.json pripravljen (aplikacija $id)"

      - name: Podpisni ključ
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nakupko.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/nakupko.keystore" >> "$GITHUB_ENV"

      - name: Preizkusi in zgradi
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ANDROID_ADMOB_APP_ID || 'ca-app-pub-2170388618811750~4504787919' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionCode=${{ github.run_number }} -PadmobAppId="$ADMOB_APP_ID"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/Nakupko.apk"
          # Google Play: ista koda, a z reklamami in naročnino (window.NAKUPKO_RELEASE).
          (cd .. && NAKUPKO_RELEASE=1 npm run sync:android)
          # Brez vtičnika AdMob v gradnji Android ne prikaže nobenega oglasa (tako je bilo do 1.3.7).
          grep -q '"AdMob"\|admob' app/src/main/assets/capacitor.plugins.json || { echo "::error::AdMob vtičnik ni v gradnji (capacitor.plugins.json)"; exit 1; }
          # Google Play gradnja brez FCM ne dobi obvestil skupnega seznama (tako je bilo do 1.3.8).
          if [ "${{ github.event_name }}" != "pull_request" ] && [ ! -s app/google-services.json ]; then echo "::error::Ni google-services.json: AAB bi bil brez obvestil"; exit 1; fi
          ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }} -PadmobAppId="$ADMOB_APP_ID"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/Nakupko.aab"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Ni podpisnega ključa (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD). APK je podpisan začasno: posodobitev ne bo šla čez staro različico, Google Play pa ga ne sprejme."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nakupko-android-${{ github.run_number }}
          path: ${{ runner.temp }}/out/

      - name: Objavi za prenos
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag --yes || true
          gh release create android "$RUNNER_TEMP/out/Nakupko.apk" "$RUNNER_TEMP/out/Nakupko.aab" \
            --target "$GITHUB_SHA" --prerelease --title "Nakupko za Android (gradnja ${{ github.run_number }})" \
            --notes "Na Android telefonu odpri https://github.com/${{ github.repository }}/releases/download/android/Nakupko.apk in namesti. Nakupko.aab je za Google Play Console."
