name: Posnetki zaslona v trgovinah

# Zamenja posnetke zaslona v App Store Connect (verzija iz projekta) in Google Play predstavitvi.
# Slike so v izdaji GitHub "trgovina-slike" (slike.zip: appstore/<jezik>/N.jpg, googleplay/<jezik>/N.jpg).
# Zažene se ob pushu na vejo trgovina-slike. Samo z OK uporabnika.
on:
  push:
    branches: [trgovina-slike]

jobs:
  slike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prenesi slike
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download trgovina-slike -p slike.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/slike.zip" -d "$RUNNER_TEMP/slike"
          echo "verzija=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' native/ios/App/App.xcodeproj/project.pbxproj | awk '{print $3}')" >> "$GITHUB_ENV"
      - run: pip install "pyjwt[crypto]" requests google-api-python-client google-auth
      - name: App Store
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          BUNDLE_ID: si.nakupko.app
          VERZIJA: ${{ env.verzija }}
          MAPA: ${{ runner.temp }}/slike/appstore
        run: python .github/scripts/appstore-slike.py
      - name: Google Play
        if: always()
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PAKET: si.nakupko.app
          MAPA: ${{ runner.temp }}/slike/googleplay
        run: python .github/scripts/play-slike.py
