name: App Store verzija (priprava za pregled)

# Ustvari verzijo v App Store Connect, doda build in vpiše »Kaj je novega«. V pregled ne odda.
# Zažene se ob pushu na vejo appstore-verzija (ali ročno).
on:
  push:
    branches: [appstore-verzija]
  workflow_dispatch:
    inputs:
      verzija:
        description: "Verzija (npr. 1.3.5)"
        required: false

jobs:
  pripravi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verzija iz projekta
        id: v
        run: |
          V="${{ inputs.verzija }}"
          if [ -z "$V" ]; then V=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' native/ios/App/App.xcodeproj/project.pbxproj | awk '{print $3}'); fi
          echo "verzija=$V" >> "$GITHUB_OUTPUT"
      - run: pip install "pyjwt[crypto]"
      - name: Pripravi verzijo v App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          VERZIJA: ${{ steps.v.outputs.verzija }}
          BUNDLE_ID: si.nakupko.app
        run: python .github/scripts/appstore-verzija.py
