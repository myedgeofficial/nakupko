name: probe
on:
  push:
    branches: [cene-nocno]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          j() { echo "=================== $1"; curl -sSL -m 25 -A "$UA" -o o.txt -w "HTTP %{http_code} %{size_download}B\n" "$1"; python3 -c "
          import json,sys
          try:
            d=json.load(open('o.txt'))
          except Exception as e:
            print('notjson', open('o.txt').read()[:300]); sys.exit()
          print({k:(v if not isinstance(v,list) else 'list%d'%len(v)) for k,v in d.items()} if isinstance(d,dict) else 'list%d'%len(d))
          ps=d.get('products',d if isinstance(d,list) else [])
          for p in ps[:6]: print(' -', p.get('name'), [(s.get('storeSlug'),s.get('regularPrice'),s.get('actionPrice'),s.get('pricePerUnit'),s.get('unitLabel')) for s in p.get('storePrices',[])])
          "; }
          for q in "search=gauda" "q=gauda" "query=gauda" "name=gauda" "term=gauda" "s=gauda"; do j "https://www.polnakosarica.si/api/products?$q"; done
          j "https://www.polnakosarica.si/api/search?q=gauda"
          j "https://www.polnakosarica.si/api/products/search?q=gauda"
          j "https://www.polnakosarica.si/api/stores"
          j "https://www.polnakosarica.si/api/products?page=2&limit=100"
          curl -sSL -A "$UA" https://www.polnakosarica.si/ -o home.html
          for c in $(grep -o '/_next/static/chunks/[^"]*\.js' home.html | sort -u); do curl -sSL -A "$UA" "https://www.polnakosarica.si$c"; echo; done > chunks.js
          grep -o '"/api/[^"]*"\|`/api/[^`]*`\|/api/[a-zA-Z/_-]*[?][^"`]*' chunks.js | sort -u | head -50
          curl -sSL -A "$UA" "https://www.polnakosarica.si/iskanje?q=gauda" -o s.html; grep -o '/_next/static/chunks/[^"]*\.js' s.html | sort -u | while read c; do curl -sSL -A "$UA" "https://www.polnakosarica.si$c"; done | grep -o '/api/[a-zA-Z/_-]*[^"`]\{0,80\}' | sort -u | head -40
