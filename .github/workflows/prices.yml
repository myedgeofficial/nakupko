name: Nočna osvežitev cen

# Vsak dan ob ~3h (po slovenskem času) preveri cene in akcije vseh izdelkov v trgovinah
# in jih shrani v prices.js / prices.json. Commit z GITHUB_TOKEN ne sproži iOS/Android gradnje,
# aplikacija si nove cene prenese sama.
on:
  schedule:
    # GitHub urnike včasih izpusti, zato več poskusov; zažene se le prvi, ki pade v 3h–5h po slovenskem času
    - cron: "7 1 * * *"
    - cron: "37 1 * * *"
    - cron: "7 2 * * *"
    - cron: "37 2 * * *"
    - cron: "7 3 * * *"
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      preizkus_alarma:
        description: "Preizkusi obvestilo (simuliraj zaprt dostop)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Samo enkrat na dan, med 3h in 6h po slovenskem času
        id: when
        run: |
          H=$(TZ=Europe/Ljubljana date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$H" -lt 3 ] || [ "$H" -gt 5 ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Ura v Sloveniji je $H, preskočim."; exit 0; fi
          TODAY=$(TZ=Europe/Ljubljana date +%Y-%m-%d)
          git fetch -q origin main
          DONE=$(git show origin/main:prices.json | python3 -c "import json,sys;print(json.load(sys.stdin).get('preverjeno',''))")
          if [ "$DONE" = "$TODAY" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Danes je že bilo osveženo."; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'yes'
        with:
          node-version: 22
      - name: Poberi cene
        id: fetch
        if: steps.when.outputs.run == 'yes'
        env:
          PRICES_API: ${{ inputs.preizkus_alarma && 'https://www.polnakosarica.si/api/ni-tega' || '' }}
        run: node scripts/update-prices.mjs
      - name: Shrani, če se je kaj spremenilo
        if: steps.when.outputs.run == 'yes' && github.ref == 'refs/heads/main'
        run: |
          git add -N prices.json 2>/dev/null || true
          if git diff --quiet -- prices.js prices.json; then echo "Ni sprememb."; exit 0; fi
          git config user.name "nakupko-cene"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.js prices.json
          git commit -m "Cene $(TZ=Europe/Ljubljana date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Predogled sprememb (testna veja)
        if: steps.when.outputs.run == 'yes' && github.ref != 'refs/heads/main'
        run: git diff --stat; git diff prices.js | head -c 3000 || true
      - name: Obvesti lastnika, če vir cen ne deluje (GitHub issue = e-mail)
        if: failure() && steps.fetch.outcome == 'failure' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHY=$(cat .price-error 2>/dev/null || echo "Skripta za cene se je končala z napako.")
          BODY="Nočna osvežitev cen ($(TZ=Europe/Ljubljana date '+%d. %m. %Y %H:%M')) ni uspela.

          $WHY

          Cene v aplikaciji ostajajo od zadnjega uspešnega dne, nič se ne pokvari, a niso več sveže.
          Dnevnik: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "Cene se ne osvežujejo in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"
          else gh issue create --title "Cene se ne osvežujejo: polnakosarica.si ne deluje" --body "$BODY" --assignee "${{ github.repository_owner }}"; fi
      - name: Zapri opozorilo, ko vir spet deluje
        if: success() && steps.fetch.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --state open --search "Cene se ne osvežujejo in:title" --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Cene se spet osvežujejo ($(TZ=Europe/Ljubljana date '+%d. %m. %Y'))."
          done
