name: Nočna osvežitev cen

# Vsak dan ob ~3h (po slovenskem času) preveri cene in akcije vseh izdelkov v trgovinah
# in jih shrani v prices.js / prices.json. Commit z GITHUB_TOKEN ne sproži iOS/Android gradnje,
# aplikacija si nove cene prenese sama.
on:
  schedule:
    - cron: "5 1 * * *"   # 03:05 poleti (CEST)
    - cron: "5 2 * * *"   # 03:05 pozimi (CET)
  workflow_dispatch:
  push:
    branches: [cene-nocno]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Samo enkrat na dan, ob 3h po slovenskem času
        id: when
        run: |
          H=$(TZ=Europe/Ljubljana date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "03" ] && [ "$H" != "04" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "Ura v Sloveniji je $H, preskočim."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'yes'
        with:
          node-version: 22
      - name: Poberi cene
        if: steps.when.outputs.run == 'yes'
        run: node scripts/update-prices.mjs
      - name: Shrani, če se je kaj spremenilo
        if: steps.when.outputs.run == 'yes' && github.ref == 'refs/heads/main'
        run: |
          git add -N prices.json 2>/dev/null || true
          if git diff --quiet -- prices.js prices.json; then echo "Ni sprememb."; exit 0; fi
          git config user.name "nakupko-cene"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.js prices.json
          git commit -m "Cene $(TZ=Europe/Ljubljana date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Predogled sprememb (testna veja)
        if: steps.when.outputs.run == 'yes' && github.ref != 'refs/heads/main'
        run: git diff --stat; git diff prices.js | head -c 3000 || true
